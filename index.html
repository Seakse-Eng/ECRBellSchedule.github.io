<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Camino Real Bell Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ctp: {
                            base: 'rgb(var(--ctp-base) / <alpha-value>)',
                            mantle: 'rgb(var(--ctp-mantle) / <alpha-value>)',
                            surface0: 'rgb(var(--ctp-surface0) / <alpha-value>)',
                            surface1: 'rgb(var(--ctp-surface1) / <alpha-value>)',
                            surface2: 'rgb(var(--ctp-surface2) / <alpha-value>)',
                            text: 'rgb(var(--ctp-text) / <alpha-value>)',
                            subtext: 'rgb(var(--ctp-subtext) / <alpha-value>)',
                            accent: 'rgb(var(--ctp-accent) / <alpha-value>)',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Catppuccin Palettes */
        :root[data-theme="latte"] {
            --ctp-base: 239 241 245; 
            --ctp-mantle: 230 233 239; 
            --ctp-surface0: 204 208 218; 
            --ctp-surface1: 188 192 204; 
            --ctp-surface2: 172 176 190; 
            --ctp-text: 76 79 105; 
            --ctp-subtext: 92 95 119; 
            --ctp-accent: 136 57 239; /* Mauve */
            color-scheme: light;
        }
        :root[data-theme="frappe"] {
            --ctp-base: 48 52 70;
            --ctp-mantle: 41 44 60;
            --ctp-surface0: 65 69 89;
            --ctp-surface1: 81 87 109;
            --ctp-surface2: 98 104 128;
            --ctp-text: 198 208 245;
            --ctp-subtext: 181 191 226;
            --ctp-accent: 202 158 230; /* Mauve */
            color-scheme: dark;
        }
        :root[data-theme="macchiato"] {
            --ctp-base: 36 39 58;
            --ctp-mantle: 30 32 48;
            --ctp-surface0: 54 58 79;
            --ctp-surface1: 73 77 100;
            --ctp-surface2: 91 96 120;
            --ctp-text: 202 211 245;
            --ctp-subtext: 184 192 224;
            --ctp-accent: 198 160 246; /* Mauve */
            color-scheme: dark;
        }
        :root[data-theme="mocha"] {
            --ctp-base: 30 30 46;
            --ctp-mantle: 24 24 37;
            --ctp-surface0: 49 50 68;
            --ctp-surface1: 69 71 90;
            --ctp-surface2: 88 91 112;
            --ctp-text: 205 214 244;
            --ctp-subtext: 186 194 222;
            --ctp-accent: 203 166 247; /* Mauve */
            color-scheme: dark;
        }

        body { background-color: rgb(var(--ctp-base)); color: rgb(var(--ctp-text)); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: rgb(var(--ctp-surface2)); border-radius: 10px; }
        
        .circle-bg { fill: none; stroke: currentColor; stroke-width: 8; }
        .circle-progress { 
            fill: none; stroke: rgb(var(--ctp-accent)); stroke-width: 8; stroke-linecap: round; 
            transition: stroke-dashoffset 1s linear; transform: rotate(-90deg); transform-origin: 50% 50%;
        }

        #glider {
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            will-change: transform, width;
        }

        .bg-topology {
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3z' fill='currentColor' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            background-repeat: repeat;
        }
    </style>
</head>
<body class="transition-colors duration-300 font-sans min-h-screen relative overflow-x-hidden">

    <!-- Background Layers -->
    <canvas id="bg-canvas" class="fixed inset-0 z-[-1] pointer-events-none hidden opacity-50"></canvas>
    <div id="bg-css" class="fixed inset-0 z-[-1] pointer-events-none hidden text-ctp-text"></div>

    <div id="master-container" class="max-w-3xl mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6 relative z-10 transition-all duration-500">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-ctp-mantle/80 backdrop-blur-md p-4 sm:p-6 rounded-xl shadow-sm border border-ctp-surface0 transition-colors w-full">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-ctp-accent to-ctp-accent/70">
                    El Camino Real Bell Schedule
                </h1>
                <p class="text-sm text-ctp-subtext mt-1 flex flex-wrap items-center gap-2">
                    <span id="current-date-display"></span> <span class="opacity-50">•</span> Pacific Time 
                    <span id="battery-container" class="hidden flex items-center gap-1 bg-ctp-surface0/50 px-2 py-0.5 rounded-full text-xs ml-1">
                        <svg id="battery-icon" class="w-4 h-4 text-ctp-text" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
                        <span id="battery-level" class="font-mono font-bold"></span>%
                    </span>
                </p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleSettings()" class="p-2.5 rounded-full bg-ctp-surface0 hover:bg-ctp-surface1 transition-colors" title="Settings">
                    <svg class="w-5 h-5 text-ctp-text" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
        </header>

        <!-- Settings Panel -->
        <div id="settings-wrapper" class="grid transition-all duration-400 ease-in-out" style="grid-template-rows: 0fr; opacity: 0; visibility: hidden;">
            <div class="overflow-hidden">
                <div class="bg-ctp-mantle/80 backdrop-blur-md p-5 rounded-xl shadow-sm border border-ctp-surface0 mb-2">
                    <h3 class="text-lg font-semibold mb-4 border-b border-ctp-surface0 pb-2">Settings</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="flex items-center justify-between p-3 bg-ctp-surface0/40 rounded-lg">
                            <div>
                                <p class="font-medium">Hide Period 0</p>
                                <p class="text-xs text-ctp-subtext">Remove from tracker.</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="toggle-p0" class="sr-only peer" onchange="togglePeriodZero()">
                                <div class="w-11 h-6 bg-ctp-surface1 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-ctp-accent"></div>
                            </label>
                        </div>
                        <div class="flex items-center justify-between p-3 bg-ctp-surface0/40 rounded-lg">
                            <div><p class="font-medium">Dashboard Layout</p></div>
                            <select id="select-layout" onchange="updateSettings()" class="bg-ctp-surface1 border border-ctp-surface2 text-ctp-text text-sm rounded-lg focus:ring-ctp-accent focus:border-ctp-accent block p-2 outline-none">
                                <option value="vertical">Vertical</option>
                                <option value="horizontal">Horizontal</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-between p-3 bg-ctp-surface0/40 rounded-lg">
                            <div><p class="font-medium">Progress Visual</p></div>
                            <select id="select-shape" onchange="updateSettings()" class="bg-ctp-surface1 border border-ctp-surface2 text-ctp-text text-sm rounded-lg focus:ring-ctp-accent focus:border-ctp-accent block p-2 outline-none">
                                <option value="horizontal">Bar Layout</option>
                                <option value="circular">Ring Layout</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-between p-3 bg-ctp-surface0/40 rounded-lg">
                            <div><p class="font-medium">Catppuccin Theme</p></div>
                            <select id="select-color" onchange="updateSettings()" class="bg-ctp-surface1 border border-ctp-surface2 text-ctp-text text-sm rounded-lg focus:ring-ctp-accent focus:border-ctp-accent block p-2 outline-none">
                                <option value="latte">Latte (Light)</option>
                                <option value="frappe">Frappé (Dark)</option>
                                <option value="macchiato">Macchiato (Dark)</option>
                                <option value="mocha">Mocha (Dark)</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-between p-3 bg-ctp-surface0/40 rounded-lg md:col-span-2">
                            <div><p class="font-medium">Background</p></div>
                            <select id="select-bg" onchange="updateSettings()" class="bg-ctp-surface1 border border-ctp-surface2 text-ctp-text text-sm rounded-lg focus:ring-ctp-accent focus:border-ctp-accent block p-2 outline-none min-w-[150px]">
                                <option value="none">None (Default)</option>
                                <option value="matrix">Matrix Rain</option>
                                <option value="stars">Starfield</option>
                                <option value="topology">Interactive Topology</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Schedule Selector (Glider) -->
        <div class="relative flex p-1.5 bg-ctp-mantle/80 backdrop-blur-md rounded-xl shadow-inner w-full sm:w-[450px] self-center overflow-hidden border border-ctp-surface0">
            <div id="glider" class="absolute top-1.5 bottom-1.5 left-0 bg-ctp-surface1 rounded-lg shadow-sm z-0"></div>
            <button id="btn-auto" onclick="setManualSchedule('auto')" class="relative z-10 flex-1 py-2 text-sm font-semibold transition-colors text-ctp-subtext">Auto</button>
            <button id="btn-regular" onclick="setManualSchedule('regular')" class="relative z-10 flex-1 py-2 text-sm font-semibold transition-colors text-ctp-subtext">Regular</button>
            <button id="btn-common" onclick="setManualSchedule('common')" class="relative z-10 flex-1 py-2 text-sm font-semibold transition-colors text-ctp-subtext">Common</button>
        </div>

        <!-- Main Content Layout container -->
        <div id="main-content" class="flex flex-col gap-6 w-full">
            
            <!-- Live Tracker Card -->
            <div class="flex-1 bg-ctp-mantle/90 backdrop-blur-md p-6 sm:p-10 rounded-2xl shadow-lg border border-ctp-surface0 flex flex-col items-center justify-center text-center relative overflow-hidden transition-colors min-h-[350px]">
                <div class="absolute top-0 left-0 w-full h-1 bg-ctp-accent"></div>
                
                <p id="tracker-status" class="text-sm uppercase tracking-widest font-semibold text-ctp-accent mb-2">Loading...</p>
                <h2 id="tracker-period-name" class="text-3xl sm:text-4xl font-extrabold text-ctp-text mb-6">--</h2>
                
                <!-- Horizontal View -->
                <div id="view-horizontal" class="w-full flex flex-col items-center">
                    <div class="bg-ctp-surface0/30 px-6 py-4 rounded-xl border border-ctp-surface1 mb-6 w-full max-w-sm shadow-inner text-center">
                        <p id="tracker-countdown-hz" class="text-5xl sm:text-6xl font-black font-mono text-ctp-text tabular-nums tracking-tighter">00:00</p>
                        <p class="text-xs font-medium text-ctp-subtext uppercase mt-2">Time Remaining</p>
                    </div>
                    <div class="w-full max-w-md">
                        <div class="flex justify-between text-xs font-medium text-ctp-subtext mb-1">
                            <span id="tracker-start-hz">--:--</span>
                            <span id="tracker-end-hz">--:--</span>
                        </div>
                        <div class="w-full bg-ctp-surface0 rounded-full h-3 sm:h-4 overflow-hidden shadow-inner">
                            <div id="tracker-progress-hz" class="bg-ctp-accent h-full rounded-full transition-all duration-1000 ease-linear" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Circular View -->
                <div id="view-circular" class="hidden w-full flex flex-col items-center relative">
                    <div class="relative w-64 h-64 flex items-center justify-center">
                        <svg class="absolute top-0 left-0 w-full h-full" viewBox="0 0 100 100">
                            <circle class="circle-bg text-ctp-surface1" cx="50" cy="50" r="45"></circle>
                            <circle id="tracker-progress-circ" class="circle-progress" cx="50" cy="50" r="45" stroke-dasharray="283" stroke-dashoffset="283"></circle>
                        </svg>
                        <div class="z-10 flex flex-col items-center">
                            <p id="tracker-countdown-circ" class="text-4xl sm:text-5xl font-black font-mono text-ctp-text tabular-nums tracking-tighter">00:00</p>
                            <p class="text-[10px] font-medium text-ctp-subtext uppercase mt-1">Remaining</p>
                        </div>
                    </div>
                    <div class="flex justify-between text-xs font-medium text-ctp-subtext mt-4 w-64 px-2">
                        <span id="tracker-start-circ">--:--</span>
                        <span id="tracker-end-circ">--:--</span>
                    </div>
                </div>
            </div>

            <!-- Schedule Table -->
            <div class="flex-1 bg-ctp-mantle/90 backdrop-blur-md rounded-2xl shadow-sm border border-ctp-surface0 overflow-hidden transition-colors self-stretch flex flex-col">
                <div class="px-6 py-4 border-b border-ctp-surface0 bg-ctp-surface0/20 flex justify-between items-center">
                    <h3 class="font-semibold text-ctp-text" id="schedule-title">Today's Schedule</h3>
                </div>
                <div class="overflow-x-auto flex-1 max-h-[500px] overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <tbody id="schedule-body" class="divide-y divide-ctp-surface0/50">
                            <!-- Rows injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Setup Schedule Data
        const rawSchedules = {
            regular: [
                { id: 'p0', name: 'Period 0', defaultName: 'Period 0', start: '7:27 AM', end: '8:23 AM', editable: true },
                { id: 'p1', name: 'Period 1', defaultName: 'Period 1', start: '8:30 AM', end: '9:35 AM', editable: true },
                { id: 'p2', name: 'Period 2', defaultName: 'Period 2', start: '9:42 AM', end: '10:38 AM', editable: true },
                { id: 'nut', name: 'Nutrition', defaultName: 'Nutrition', start: '10:38 AM', end: '10:54 AM', editable: false },
                { id: 'p3', name: 'Period 3', defaultName: 'Period 3', start: '11:01 AM', end: '11:57 AM', editable: true },
                { id: 'p4', name: 'Period 4', defaultName: 'Period 4', start: '12:04 PM', end: '1:00 PM', editable: true },
                { id: 'lun', name: 'Lunch', defaultName: 'Lunch', start: '1:00 PM', end: '1:39 PM', editable: false },
                { id: 'p5', name: 'Period 5', defaultName: 'Period 5', start: '1:46 PM', end: '2:42 PM', editable: true },
                { id: 'p6', name: 'Period 6', defaultName: 'Period 6', start: '2:49 PM', end: '3:45 PM', editable: true }
            ],
            common: [
                { id: 'p0', name: 'Period 0', defaultName: 'Period 0', start: '7:38 AM', end: '8:23 AM', editable: true },
                { id: 'cpt', name: 'Common Planning', defaultName: 'Common Planning', start: '8:30 AM', end: '9:30 AM', editable: false },
                { id: 'p1', name: 'Period 1', defaultName: 'Period 1', start: '9:37 AM', end: '10:30 AM', editable: true },
                { id: 'p2', name: 'Period 2', defaultName: 'Period 2', start: '10:37 AM', end: '11:22 AM', editable: true },
                { id: 'nut', name: 'Nutrition', defaultName: 'Nutrition', start: '11:22 AM', end: '11:38 AM', editable: false },
                { id: 'p3', name: 'Period 3', defaultName: 'Period 3', start: '11:45 AM', end: '12:30 PM', editable: true },
                { id: 'p4', name: 'Period 4', defaultName: 'Period 4', start: '12:37 PM', end: '1:22 PM', editable: true },
                { id: 'lun', name: 'Lunch', defaultName: 'Lunch', start: '1:22 PM', end: '2:01 PM', editable: false },
                { id: 'p5', name: 'Period 5', defaultName: 'Period 5', start: '2:08 PM', end: '2:53 PM', editable: true },
                { id: 'p6', name: 'Period 6', defaultName: 'Period 6', start: '3:00 PM', end: '3:45 PM', editable: true }
            ]
        };

        let state = {
            hidePeriod0: false, customNames: {},
            scheduleMode: 'auto', theme: 'mocha', progressShape: 'horizontal', bgMode: 'none', layout: 'vertical'
        };
        let activeTimeline = [];
        let clockInterval;
        let bgAnimId = null;

        // Interactive Topology Vars
        let mouseX = 0, mouseY = 0;
        let currentBgX = 0, currentBgY = 0;

        function init() {
            loadState();
            applySettingsDOM();
            updateDateDisplay();
            initBattery();
            buildTimeline();
            renderTable();
            updateGlider();
            renderBackground();
            updateClock();
            
            if(clockInterval) clearInterval(clockInterval);
            clockInterval = setInterval(updateClock, 1000);
            
            window.addEventListener('resize', () => { updateGlider(); renderBackground(); });
            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 50; 
                mouseY = (e.clientY / window.innerHeight - 0.5) * 50;
            });
        }

        function loadState() {
            const saved = localStorage.getItem('ecrDashboardStateV5');
            if(saved) state = { ...state, ...JSON.parse(saved) };
        }

        function saveState() {
            localStorage.setItem('ecrDashboardStateV5', JSON.stringify(state));
        }

        function initBattery() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(battery) {
                    const batContainer = document.getElementById('battery-container');
                    const batLevel = document.getElementById('battery-level');
                    const batIcon = document.getElementById('battery-icon');

                    function updateBattery() {
                        // Desktop Heuristic: if charging indefinitely and fully charged
                        if (battery.charging && battery.chargingTime === 0 && battery.dischargingTime === Infinity && battery.level === 1) {
                            batContainer.classList.add('hidden');
                            return;
                        }
                        
                        batContainer.classList.remove('hidden');
                        batLevel.innerText = Math.round(battery.level * 100);
                        
                        if (battery.charging) {
                            // Charging Bolt Icon
                            batIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />`;
                        } else {
                            // Battery Levels Outline
                            if (battery.level > 0.8) {
                                batIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M2 12h20M2 8h20M2 16h20" />`; 
                            } else if (battery.level > 0.3) {
                                batIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M2 12h12M2 8h20M2 16h20" />`;
                            } else {
                                batIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M2 12h4M2 8h20M2 16h20" />`;
                            }
                        }
                    }

                    updateBattery();
                    battery.addEventListener('chargingchange', updateBattery);
                    battery.addEventListener('levelchange', updateBattery);
                });
            }
        }

        // --- Core Time Calculations ---
        function parseTimeStrDate(timeStr, baseDate) {
            const [time, modifier] = timeStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            if (hours === 12 && modifier === 'AM') hours = 0;
            if (hours !== 12 && modifier === 'PM') hours += 12;
            const d = new Date(baseDate);
            d.setHours(hours, minutes, 0, 0);
            return d;
        }

        function getScheduleForDate(d) {
            const isWed = d.getDay() === 3;
            const schedKey = (isWed && state.scheduleMode === 'auto') || state.scheduleMode === 'common' ? 'common' : 'regular';
            let sched = rawSchedules[schedKey];
            if (state.hidePeriod0) sched = sched.filter(p => p.id !== 'p0');
            return sched;
        }

        function getNextSchoolStart(nowDate) {
            let next = new Date(nowDate);
            let added = 1;
            if (next.getDay() === 5) added = 3; 
            if (next.getDay() === 6) added = 2; 
            next.setDate(next.getDate() + added);
            return parseTimeStrDate(getScheduleForDate(next)[0].start, next);
        }

        function getPrevSchoolEnd(nowDate) {
            let prev = new Date(nowDate);
            let sub = 1;
            if (prev.getDay() === 1) sub = 3; 
            if (prev.getDay() === 0) sub = 2; 
            prev.setDate(prev.getDate() - sub);
            const sched = getScheduleForDate(prev);
            return parseTimeStrDate(sched[sched.length - 1].end, prev);
        }

        function formatDuration(ms) {
            if (ms < 0) ms = 0;
            const s = Math.floor(ms / 1000);
            const hrs = Math.floor(s / 3600);
            const mins = Math.floor((s % 3600) / 60);
            const secs = s % 60;
            const pad = num => num.toString().padStart(2, '0');
            if (hrs > 0) return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
            return `${pad(mins)}:${pad(secs)}`;
        }

        function buildTimeline() {
            const now = new Date();
            const isWeekend = (now.getDay() === 0 || now.getDay() === 6) && state.scheduleMode === 'auto';
            let baseSchedule = getScheduleForDate(now);
            
            let titleText = (state.scheduleMode === 'common' || (now.getDay()===3 && state.scheduleMode === 'auto')) ? 'Common Planning Schedule' : 'Regular Schedule';
            if (state.scheduleMode === 'auto') titleText += ' (Auto)';
            document.getElementById('schedule-title').innerText = isWeekend ? "No School Today" : titleText;

            activeTimeline = [];
            if (isWeekend) return; 

            for (let i = 0; i < baseSchedule.length; i++) {
                const current = baseSchedule[i];
                const startObj = parseTimeStrDate(current.start, now);
                const endObj = parseTimeStrDate(current.end, now);
                
                activeTimeline.push({ ...current, displayName: state.customNames[current.id] || current.defaultName, startObj, endObj, isPassing: false });

                if (i < baseSchedule.length - 1) {
                    const nextStartObj = parseTimeStrDate(baseSchedule[i + 1].start, now);
                    if (endObj.getTime() < nextStartObj.getTime()) {
                        activeTimeline.push({
                            id: `pass_${i}`, displayName: `Passing Period`,
                            start: current.end, end: baseSchedule[i + 1].start,
                            startObj: endObj, endObj: nextStartObj, isPassing: true
                        });
                    }
                }
            }
        }

        function renderTrackerStats(title, subtitle, remainMs, elapsedMs, durMs, startStr, endStr, isClass = false, activeId = null) {
            document.getElementById('tracker-status').innerText = subtitle;
            document.getElementById('tracker-period-name').innerText = title;
            const progPercent = Math.min(100, Math.max(0, (elapsedMs / durMs) * 100)) || 0;
            const cdText = formatDuration(remainMs);

            if (state.progressShape === 'horizontal') {
                document.getElementById('tracker-countdown-hz').innerText = cdText;
                document.getElementById('tracker-progress-hz').style.width = `${progPercent}%`;
                document.getElementById('tracker-start-hz').innerText = startStr;
                document.getElementById('tracker-end-hz').innerText = endStr;
            } else {
                document.getElementById('tracker-countdown-circ').innerText = cdText;
                document.getElementById('tracker-start-circ').innerText = startStr;
                document.getElementById('tracker-end-circ').innerText = endStr;
                document.getElementById('tracker-progress-circ').style.strokeDashoffset = 283 - (283 * (progPercent / 100));
            }

            document.querySelectorAll('.sched-row').forEach(row => {
                row.classList.remove('bg-ctp-surface0/30', 'border-ctp-accent');
                row.classList.add('border-transparent');
            });
            if (isClass && activeId) {
                const row = document.getElementById(`row-${activeId}`);
                if (row) {
                    row.classList.remove('border-transparent');
                    row.classList.add('bg-ctp-surface0/30', 'border-ctp-accent');
                }
            }
        }

        function updateClock() {
            const now = new Date(); 
            if (activeTimeline.length === 0) {
                const pEnd = getPrevSchoolEnd(now);
                const nStart = getNextSchoolStart(now);
                renderTrackerStats("Weekend", "School Starts In", nStart - now, now - pEnd, nStart - pEnd, "--:--", "--:--");
                return;
            }

            const firstStart = activeTimeline[0].startObj;
            const lastEnd = activeTimeline[activeTimeline.length - 1].endObj;

            if (now < firstStart) {
                const pEnd = getPrevSchoolEnd(now);
                renderTrackerStats("Before School", "School Starts In", firstStart - now, now - pEnd, firstStart - pEnd, "--:--", activeTimeline[0].start);
            } else if (now >= lastEnd) {
                const nStart = getNextSchoolStart(now);
                renderTrackerStats("After School", "School Starts In", nStart - now, now - lastEnd, nStart - lastEnd, activeTimeline[activeTimeline.length-1].end, "--:--");
            } else {
                const currentBlock = activeTimeline.find(b => now >= b.startObj && now < b.endObj);
                if (currentBlock) {
                    renderTrackerStats(
                        currentBlock.displayName, 
                        currentBlock.isPassing ? "Passing Period" : "Current Class",
                        currentBlock.endObj - now, now - currentBlock.startObj, currentBlock.endObj - currentBlock.startObj,
                        currentBlock.start, currentBlock.end,
                        !currentBlock.isPassing, currentBlock.id
                    );
                }
            }
        }

        function renderTable() {
            const tbody = document.getElementById('schedule-body');
            tbody.innerHTML = '';
            if(activeTimeline.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" class="px-6 py-4 text-center text-ctp-subtext">Enjoy your weekend!</td></tr>`;
                return;
            }
            activeTimeline.filter(t => !t.isPassing).forEach(block => {
                const tr = document.createElement('tr');
                tr.id = `row-${block.id}`;
                tr.className = "sched-row transition-colors border-l-4 border-transparent hover:bg-ctp-surface0/30";
                const editBtn = block.editable ? `<button onclick="editPeriod('${block.id}')" class="ml-2 text-ctp-surface2 hover:text-ctp-accent transition-colors" title="Edit"><svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>` : '';
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-ctp-text w-1/2">${block.displayName} ${editBtn}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-ctp-subtext text-right w-1/2 font-mono">${block.start} - ${block.end}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- Interaction & Visuals ---
        function updateGlider() {
            const btns = ['auto', 'regular', 'common'];
            btns.forEach(b => {
                const el = document.getElementById(`btn-${b}`);
                if(b === state.scheduleMode) {
                    el.classList.add('text-ctp-accent');
                    el.classList.remove('text-ctp-subtext');
                    const glider = document.getElementById('glider');
                    glider.style.width = `${el.offsetWidth}px`;
                    glider.style.transform = `translateX(${el.offsetLeft}px)`;
                } else {
                    el.classList.remove('text-ctp-accent');
                    el.classList.add('text-ctp-subtext');
                }
            });
        }

        function setManualSchedule(mode) {
            state.scheduleMode = mode;
            updateGlider(); saveState(); buildTimeline(); renderTable(); updateClock();
        }

        function applySettingsDOM() {
            document.documentElement.setAttribute('data-theme', state.theme);
            document.getElementById('toggle-p0').checked = state.hidePeriod0;
            document.getElementById('select-shape').value = state.progressShape;
            document.getElementById('select-color').value = state.theme;
            document.getElementById('select-bg').value = state.bgMode;
            document.getElementById('select-layout').value = state.layout;
            
            if (state.progressShape === 'circular') {
                document.getElementById('view-horizontal').classList.add('hidden');
                document.getElementById('view-circular').classList.remove('hidden');
            } else {
                document.getElementById('view-circular').classList.add('hidden');
                document.getElementById('view-horizontal').classList.remove('hidden');
            }

            const mainContent = document.getElementById('main-content');
            const masterContainer = document.getElementById('master-container');
            if(state.layout === 'horizontal') {
                mainContent.classList.add('lg:flex-row');
                masterContainer.classList.remove('max-w-3xl');
                masterContainer.classList.add('max-w-6xl');
            } else {
                mainContent.classList.remove('lg:flex-row');
                masterContainer.classList.add('max-w-3xl');
                masterContainer.classList.remove('max-w-6xl');
            }
        }

        function updateSettings() {
            state.progressShape = document.getElementById('select-shape').value;
            state.theme = document.getElementById('select-color').value;
            state.bgMode = document.getElementById('select-bg').value;
            state.layout = document.getElementById('select-layout').value;
            applySettingsDOM(); saveState(); renderBackground(); updateClock();
        }

        function toggleSettings() {
            const wrapper = document.getElementById('settings-wrapper');
            const isOpen = wrapper.style.gridTemplateRows === '1fr';
            if (isOpen) {
                wrapper.style.gridTemplateRows = '0fr';
                wrapper.style.opacity = '0';
                setTimeout(() => wrapper.style.visibility = 'hidden', 400);
            } else {
                wrapper.style.visibility = 'visible';
                wrapper.style.gridTemplateRows = '1fr';
                wrapper.style.opacity = '1';
            }
        }

        function togglePeriodZero() {
            state.hidePeriod0 = document.getElementById('toggle-p0').checked;
            saveState(); buildTimeline(); renderTable(); updateClock();
        }

        function editPeriod(id) {
            let defName = '';
            for(let k in rawSchedules) {
                const f = rawSchedules[k].find(p => p.id === id);
                if(f) { defName = f.defaultName; break; }
            }
            const current = state.customNames[id] || defName;
            const newName = prompt(`Enter custom name for ${defName}:`, current);
            if (newName !== null) {
                const t = newName.trim();
                if (t === '' || t === defName) delete state.customNames[id];
                else state.customNames[id] = t;
                saveState(); buildTimeline(); renderTable(); updateClock();
            }
        }

        function updateDateDisplay() {
            const o = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date-display').innerText = new Date().toLocaleDateString(undefined, o);
        }

        // --- Background Animations ---
        function renderBackground() {
            cancelAnimationFrame(bgAnimId);
            const canvas = document.getElementById('bg-canvas');
            const cssBg = document.getElementById('bg-css');
            const ctx = canvas.getContext('2d');
            
            canvas.classList.add('hidden');
            cssBg.className = 'fixed inset-0 z-[-1] pointer-events-none hidden text-ctp-text';

            if (state.bgMode === 'none') return;

            if (state.bgMode === 'topology') {
                cssBg.classList.remove('hidden');
                cssBg.classList.add('bg-topology');
                
                function animateTopology() {
                    if (state.bgMode !== 'topology') return;
                    currentBgX += (mouseX - currentBgX) * 0.05;
                    currentBgY += (mouseY - currentBgY) * 0.05;
                    cssBg.style.backgroundPosition = `${currentBgX}px ${currentBgY}px`;
                    bgAnimId = requestAnimationFrame(animateTopology);
                }
                animateTopology();
                return;
            }

            canvas.classList.remove('hidden');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Fetch dynamic theme colors
            const styles = getComputedStyle(document.documentElement);
            const rawAccent = styles.getPropertyValue('--ctp-accent').trim().split(' ').join(',');
            const rawBase = styles.getPropertyValue('--ctp-base').trim().split(' ').join(',');
            const primaryColor = `rgb(${rawAccent})`;
            const wipeColor = `rgba(${rawBase}, 0.15)`;
            const starColor = state.theme === 'latte' ? `rgb(${styles.getPropertyValue('--ctp-text').trim().split(' ').join(',')})` : primaryColor;

            if (state.bgMode === 'matrix') {
                const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
                const fontSize = 14;
                const columns = canvas.width / fontSize;
                
                // Scatter the starting drops randomly above the screen so they don't fall in a flat uniform line
                const drops = Array.from({length: Math.floor(columns)}, () => Math.floor(Math.random() * -30));
                
                let lastDraw = 0;
                let frameCount = 0;
                // Calculate roughly how many frames it takes to entirely fill the screen height
                const maxInitialFrames = (canvas.height / fontSize) + 35;
                
                function drawMatrix(time) {
                    bgAnimId = requestAnimationFrame(drawMatrix);
                    if (!time) time = performance.now();
                    
                    // Run with 0 delay (maximum frame rate) during the initial rollout, then throttle down to 65ms
                    const delay = frameCount < maxInitialFrames ? 0 : 65;
                    
                    if (time - lastDraw < delay) return; 
                    lastDraw = time;
                    frameCount++;

                    ctx.fillStyle = wipeColor;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = primaryColor;
                    ctx.font = fontSize + 'px monospace';
                    for(let i = 0; i < drops.length; i++) {
                        const text = chars[Math.floor(Math.random() * chars.length)];
                        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                        if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                        drops[i]++;
                    }
                }
                drawMatrix();
            } else if (state.bgMode === 'stars') {
                const numStars = 150;
                const stars = Array.from({length: numStars}, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    z: Math.random() * 2
                }));
                function drawStars() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = starColor;
                    stars.forEach(star => {
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, star.z, 0, Math.PI * 2);
                        ctx.fill();
                        star.y -= star.z * 0.5;
                        if (star.y < 0) { star.y = canvas.height; star.x = Math.random() * canvas.width; }
                    });
                    bgAnimId = requestAnimationFrame(drawStars);
                }
                drawStars();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
