<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bell Schedule Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: 'var(--brand-50)',
                            100: 'var(--brand-100)',
                            400: 'var(--brand-400)',
                            500: 'var(--brand-500)',
                            600: 'var(--brand-600)',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Base Themes */
        :root {
            --brand-50: #f0fdfa; --brand-100: #ccfbf1; --brand-400: #2dd4bf; --brand-500: #14b8a6; --brand-600: #0d9488;
        }
        :root[data-color="blue"] {
            --brand-50: #eff6ff; --brand-100: #dbeafe; --brand-400: #60a5fa; --brand-500: #3b82f6; --brand-600: #2563eb;
        }
        :root[data-color="rose"] {
            --brand-50: #fff1f2; --brand-100: #ffe4e6; --brand-400: #fb7185; --brand-500: #f43f5e; --brand-600: #e11d48;
        }
        :root[data-color="violet"] {
            --brand-50: #f5f3ff; --brand-100: #ede9fe; --brand-400: #a78bfa; --brand-500: #8b5cf6; --brand-600: #7c3aed;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background-color: #475569; }
        
        /* Circular Progress Animation */
        .circle-bg { fill: none; stroke: currentColor; stroke-width: 8; }
        .circle-progress { 
            fill: none; stroke: var(--brand-500); stroke-width: 8; stroke-linecap: round; 
            transition: stroke-dashoffset 1s linear; transform: rotate(-90deg); transform-origin: 50% 50%;
        }

        /* Glider for segmented control */
        #glider {
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            will-change: transform, width;
        }

        /* Topography Background */
        .bg-topology {
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3z' fill='%239C92AC' fill-opacity='0.15' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300 font-sans min-h-screen relative overflow-x-hidden">

    <!-- Background Layers -->
    <canvas id="bg-canvas" class="fixed inset-0 z-[-1] pointer-events-none hidden opacity-30 dark:opacity-50"></canvas>
    <div id="bg-css" class="fixed inset-0 z-[-1] pointer-events-none hidden"></div>

    <div class="max-w-3xl mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6 relative z-10">
        
        <!-- Header -->
        <header class="flex items-center justify-between bg-white/90 dark:bg-gray-800/90 backdrop-blur-md p-4 sm:p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 transition-colors">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-600 to-brand-400">
                    Bell Schedule
                </h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1" id="current-date-display"></p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleSettings()" class="p-2.5 rounded-full bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 transition-colors" title="Settings">
                    <svg class="w-5 h-5 text-gray-700 dark:text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
                <button onclick="toggleTheme()" class="p-2.5 rounded-full bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 transition-colors" title="Toggle Theme">
                    <svg id="theme-icon-light" class="w-5 h-5 hidden text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="theme-icon-dark" class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </header>

        <!-- Settings Panel (Smooth Dropdown) -->
        <div id="settings-wrapper" class="grid transition-all duration-400 ease-in-out" style="grid-template-rows: 0fr; opacity: 0; visibility: hidden;">
            <div class="overflow-hidden">
                <div class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md p-5 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 mb-2">
                    <h3 class="text-lg font-semibold mb-4 border-b border-gray-100 dark:border-gray-700 pb-2">Settings</h3>
                    <div class="flex flex-col gap-4">
                        <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                            <div>
                                <p class="font-medium">Hide Period 0</p>
                                <p class="text-xs text-gray-500 dark:text-gray-400">Remove from tracker.</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="toggle-p0" class="sr-only peer" onchange="togglePeriodZero()">
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-brand-500"></div>
                            </label>
                        </div>
                        <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                            <div>
                                <p class="font-medium">Progress Visual</p>
                            </div>
                            <select id="select-shape" onchange="updateSettings()" class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block p-2">
                                <option value="horizontal">Horizontal</option>
                                <option value="circular">Circular</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                            <div>
                                <p class="font-medium">Theme Color</p>
                            </div>
                            <select id="select-color" onchange="updateSettings()" class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block p-2">
                                <option value="teal">Teal</option>
                                <option value="blue">Blue</option>
                                <option value="rose">Rose</option>
                                <option value="violet">Violet</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                            <div>
                                <p class="font-medium">Background</p>
                            </div>
                            <select id="select-bg" onchange="updateSettings()" class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block p-2">
                                <option value="none">None (Default)</option>
                                <option value="matrix">Matrix Rain</option>
                                <option value="stars">Starfield</option>
                                <option value="topology">Topology</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Schedule Selector (Glider) -->
        <div class="relative flex p-1.5 bg-gray-200 dark:bg-gray-800/80 backdrop-blur-md rounded-xl shadow-inner w-full sm:w-[450px] self-center overflow-hidden">
            <div id="glider" class="absolute top-1.5 bottom-1.5 left-0 bg-white dark:bg-gray-700 rounded-lg shadow-sm z-0"></div>
            <button id="btn-auto" onclick="setManualSchedule('auto')" class="relative z-10 flex-1 py-2 text-sm font-semibold transition-colors text-gray-500 dark:text-gray-400">Auto</button>
            <button id="btn-regular" onclick="setManualSchedule('regular')" class="relative z-10 flex-1 py-2 text-sm font-semibold transition-colors text-gray-500 dark:text-gray-400">Regular</button>
            <button id="btn-common" onclick="setManualSchedule('common')" class="relative z-10 flex-1 py-2 text-sm font-semibold transition-colors text-gray-500 dark:text-gray-400">Common</button>
        </div>

        <!-- Live Tracker Card -->
        <div class="bg-white/95 dark:bg-gray-800/95 backdrop-blur-md p-6 sm:p-10 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700 flex flex-col items-center text-center relative overflow-hidden transition-colors">
            <div class="absolute top-0 left-0 w-full h-1 bg-brand-500"></div>
            
            <p id="tracker-status" class="text-sm uppercase tracking-widest font-semibold text-brand-600 dark:text-brand-400 mb-2">Loading...</p>
            <h2 id="tracker-period-name" class="text-3xl sm:text-4xl font-extrabold text-gray-900 dark:text-white mb-6">--</h2>
            
            <!-- Horizontal View -->
            <div id="view-horizontal" class="w-full flex flex-col items-center">
                <div class="bg-gray-50 dark:bg-gray-900 px-6 py-4 rounded-xl border border-gray-100 dark:border-gray-700 mb-6 w-full max-w-sm shadow-inner text-center">
                    <p id="tracker-countdown-hz" class="text-5xl sm:text-6xl font-black font-mono text-gray-800 dark:text-gray-100 tabular-nums tracking-tighter">00:00</p>
                    <p class="text-xs font-medium text-gray-500 uppercase mt-2">Time Remaining</p>
                </div>
                <div class="w-full max-w-md">
                    <div class="flex justify-between text-xs font-medium text-gray-500 mb-1">
                        <span id="tracker-start-hz">--:--</span>
                        <span id="tracker-end-hz">--:--</span>
                    </div>
                    <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3 sm:h-4 overflow-hidden shadow-inner">
                        <div id="tracker-progress-hz" class="bg-brand-500 h-full rounded-full transition-all duration-1000 ease-linear" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Circular View -->
            <div id="view-circular" class="hidden w-full flex flex-col items-center relative">
                <div class="relative w-64 h-64 flex items-center justify-center">
                    <svg class="absolute top-0 left-0 w-full h-full" viewBox="0 0 100 100">
                        <circle class="circle-bg text-gray-200 dark:text-gray-700" cx="50" cy="50" r="45"></circle>
                        <circle id="tracker-progress-circ" class="circle-progress" cx="50" cy="50" r="45" stroke-dasharray="283" stroke-dashoffset="283"></circle>
                    </svg>
                    <div class="z-10 flex flex-col items-center">
                        <p id="tracker-countdown-circ" class="text-4xl sm:text-5xl font-black font-mono text-gray-800 dark:text-gray-100 tabular-nums tracking-tighter">00:00</p>
                        <p class="text-[10px] font-medium text-gray-500 uppercase mt-1">Remaining</p>
                    </div>
                </div>
                <div class="flex justify-between text-xs font-medium text-gray-500 mt-4 w-64 px-2">
                    <span id="tracker-start-circ">--:--</span>
                    <span id="tracker-end-circ">--:--</span>
                </div>
            </div>
        </div>

        <!-- Schedule Table -->
        <div class="bg-white/95 dark:bg-gray-800/95 backdrop-blur-md rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden transition-colors">
            <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/50 flex justify-between items-center">
                <h3 class="font-semibold text-gray-800 dark:text-gray-200" id="schedule-title">Today's Schedule</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <tbody id="schedule-body" class="divide-y divide-gray-100 dark:divide-gray-700/50">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
        
    </div>

    <script>
        // Setup Schedule Data
        const rawSchedules = {
            regular: [
                { id: 'p0', name: 'Period 0', defaultName: 'Period 0', start: '7:27 AM', end: '8:23 AM', editable: true },
                { id: 'p1', name: 'Period 1', defaultName: 'Period 1', start: '8:30 AM', end: '9:35 AM', editable: true },
                { id: 'p2', name: 'Period 2', defaultName: 'Period 2', start: '9:42 AM', end: '10:38 AM', editable: true },
                { id: 'nut', name: 'Nutrition', defaultName: 'Nutrition', start: '10:38 AM', end: '10:54 AM', editable: false },
                { id: 'p3', name: 'Period 3', defaultName: 'Period 3', start: '11:01 AM', end: '11:57 AM', editable: true },
                { id: 'p4', name: 'Period 4', defaultName: 'Period 4', start: '12:04 PM', end: '1:00 PM', editable: true },
                { id: 'lun', name: 'Lunch', defaultName: 'Lunch', start: '1:00 PM', end: '1:39 PM', editable: false },
                { id: 'p5', name: 'Period 5', defaultName: 'Period 5', start: '1:46 PM', end: '2:42 PM', editable: true },
                { id: 'p6', name: 'Period 6', defaultName: 'Period 6', start: '2:49 PM', end: '3:45 PM', editable: true }
            ],
            common: [
                { id: 'p0', name: 'Period 0', defaultName: 'Period 0', start: '7:38 AM', end: '8:23 AM', editable: true },
                { id: 'cpt', name: 'Common Planning', defaultName: 'Common Planning', start: '8:30 AM', end: '9:30 AM', editable: false },
                { id: 'p1', name: 'Period 1', defaultName: 'Period 1', start: '9:37 AM', end: '10:30 AM', editable: true },
                { id: 'p2', name: 'Period 2', defaultName: 'Period 2', start: '10:37 AM', end: '11:22 AM', editable: true },
                { id: 'nut', name: 'Nutrition', defaultName: 'Nutrition', start: '11:22 AM', end: '11:38 AM', editable: false },
                { id: 'p3', name: 'Period 3', defaultName: 'Period 3', start: '11:45 AM', end: '12:30 PM', editable: true },
                { id: 'p4', name: 'Period 4', defaultName: 'Period 4', start: '12:37 PM', end: '1:22 PM', editable: true },
                { id: 'lun', name: 'Lunch', defaultName: 'Lunch', start: '1:22 PM', end: '2:01 PM', editable: false },
                { id: 'p5', name: 'Period 5', defaultName: 'Period 5', start: '2:08 PM', end: '2:53 PM', editable: true },
                { id: 'p6', name: 'Period 6', defaultName: 'Period 6', start: '3:00 PM', end: '3:45 PM', editable: true }
            ]
        };

        // State Management
        let state = {
            hidePeriod0: false, customNames: {}, theme: 'light',
            scheduleMode: 'auto', colorScheme: 'teal', progressShape: 'horizontal', bgMode: 'none'
        };
        let activeTimeline = [];
        let clockInterval;
        let bgAnimId = null;

        function init() {
            loadState();
            applyTheme();
            applySettingsDOM();
            updateDateDisplay();
            buildTimeline();
            renderTable();
            updateGlider();
            renderBackground();
            updateClock();
            
            if(clockInterval) clearInterval(clockInterval);
            clockInterval = setInterval(updateClock, 1000);
            
            window.addEventListener('resize', () => { updateGlider(); renderBackground(); });
        }

        function loadState() {
            const saved = localStorage.getItem('bellDashboardStateV3');
            if(saved) state = { ...state, ...JSON.parse(saved) };
            else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) state.theme = 'dark';
        }

        function saveState() {
            localStorage.setItem('bellDashboardStateV3', JSON.stringify(state));
        }

        // --- Core Time Calculations ---
        function parseTimeStrDate(timeStr, baseDate) {
            const [time, modifier] = timeStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            if (hours === 12 && modifier === 'AM') hours = 0;
            if (hours !== 12 && modifier === 'PM') hours += 12;
            const d = new Date(baseDate);
            d.setHours(hours, minutes, 0, 0);
            return d;
        }

        function getScheduleForDate(d) {
            const isWed = d.getDay() === 3;
            const schedKey = (isWed && state.scheduleMode === 'auto') || state.scheduleMode === 'common' ? 'common' : 'regular';
            let sched = rawSchedules[schedKey];
            if (state.hidePeriod0) sched = sched.filter(p => p.id !== 'p0');
            return sched;
        }

        function getNextSchoolStart(nowDate) {
            let next = new Date(nowDate);
            let added = 1;
            if (next.getDay() === 5) added = 3; // Fri -> Mon
            if (next.getDay() === 6) added = 2; // Sat -> Mon
            next.setDate(next.getDate() + added);
            return parseTimeStrDate(getScheduleForDate(next)[0].start, next);
        }

        function getPrevSchoolEnd(nowDate) {
            let prev = new Date(nowDate);
            let sub = 1;
            if (prev.getDay() === 1) sub = 3; // Mon -> Fri
            if (prev.getDay() === 0) sub = 2; // Sun -> Fri
            prev.setDate(prev.getDate() - sub);
            const sched = getScheduleForDate(prev);
            return parseTimeStrDate(sched[sched.length - 1].end, prev);
        }

        function formatDuration(ms) {
            if (ms < 0) ms = 0;
            const s = Math.floor(ms / 1000);
            const hrs = Math.floor(s / 3600);
            const mins = Math.floor((s % 3600) / 60);
            const secs = s % 60;
            const pad = num => num.toString().padStart(2, '0');
            if (hrs > 0) return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
            return `${pad(mins)}:${pad(secs)}`;
        }

        function buildTimeline() {
            const now = new Date();
            const isWeekend = (now.getDay() === 0 || now.getDay() === 6) && state.scheduleMode === 'auto';
            let baseSchedule = getScheduleForDate(now);
            
            let titleText = (state.scheduleMode === 'common' || (now.getDay()===3 && state.scheduleMode === 'auto')) ? 'Common Planning Schedule' : 'Regular Schedule';
            if (state.scheduleMode === 'auto') titleText += ' (Auto)';
            document.getElementById('schedule-title').innerText = isWeekend ? "No School Today" : titleText;

            activeTimeline = [];
            if (isWeekend) return; // Empty timeline for Auto weekends

            for (let i = 0; i < baseSchedule.length; i++) {
                const current = baseSchedule[i];
                const startObj = parseTimeStrDate(current.start, now);
                const endObj = parseTimeStrDate(current.end, now);
                
                activeTimeline.push({ ...current, displayName: state.customNames[current.id] || current.defaultName, startObj, endObj, isPassing: false });

                if (i < baseSchedule.length - 1) {
                    const nextStartObj = parseTimeStrDate(baseSchedule[i + 1].start, now);
                    if (endObj.getTime() < nextStartObj.getTime()) {
                        activeTimeline.push({
                            id: `pass_${i}`, displayName: `Passing Period`,
                            start: current.end, end: baseSchedule[i + 1].start,
                            startObj: endObj, endObj: nextStartObj, isPassing: true
                        });
                    }
                }
            }
        }

        function renderTrackerStats(title, subtitle, remainMs, elapsedMs, durMs, startStr, endStr, isClass = false, activeId = null) {
            document.getElementById('tracker-status').innerText = subtitle;
            document.getElementById('tracker-period-name').innerText = title;
            const progPercent = Math.min(100, Math.max(0, (elapsedMs / durMs) * 100)) || 0;
            const cdText = formatDuration(remainMs);

            if (state.progressShape === 'horizontal') {
                document.getElementById('tracker-countdown-hz').innerText = cdText;
                document.getElementById('tracker-progress-hz').style.width = `${progPercent}%`;
                document.getElementById('tracker-start-hz').innerText = startStr;
                document.getElementById('tracker-end-hz').innerText = endStr;
            } else {
                document.getElementById('tracker-countdown-circ').innerText = cdText;
                document.getElementById('tracker-start-circ').innerText = startStr;
                document.getElementById('tracker-end-circ').innerText = endStr;
                document.getElementById('tracker-progress-circ').style.strokeDashoffset = 283 - (283 * (progPercent / 100));
            }

            document.querySelectorAll('.sched-row').forEach(row => {
                row.classList.remove('bg-brand-50', 'dark:bg-brand-900/20', 'border-brand-500');
                row.classList.add('border-transparent');
            });
            if (isClass && activeId) {
                const row = document.getElementById(`row-${activeId}`);
                if (row) {
                    row.classList.remove('border-transparent');
                    row.classList.add('bg-brand-50', 'dark:bg-brand-900/20', 'border-brand-500');
                }
            }
        }

        function updateClock() {
            const now = new Date();
            if (activeTimeline.length === 0) {
                // Weekend out of session
                const pEnd = getPrevSchoolEnd(now);
                const nStart = getNextSchoolStart(now);
                renderTrackerStats("Weekend", "School Starts In", nStart - now, now - pEnd, nStart - pEnd, "--:--", "--:--");
                return;
            }

            const firstStart = activeTimeline[0].startObj;
            const lastEnd = activeTimeline[activeTimeline.length - 1].endObj;

            if (now < firstStart) {
                const pEnd = getPrevSchoolEnd(now);
                renderTrackerStats("Before School", "School Starts In", firstStart - now, now - pEnd, firstStart - pEnd, "--:--", activeTimeline[0].start);
            } else if (now >= lastEnd) {
                const nStart = getNextSchoolStart(now);
                renderTrackerStats("After School", "School Starts In", nStart - now, now - lastEnd, nStart - lastEnd, activeTimeline[activeTimeline.length-1].end, "--:--");
            } else {
                const currentBlock = activeTimeline.find(b => now >= b.startObj && now < b.endObj);
                if (currentBlock) {
                    renderTrackerStats(
                        currentBlock.displayName, 
                        currentBlock.isPassing ? "Passing Period" : "Current Class",
                        currentBlock.endObj - now, now - currentBlock.startObj, currentBlock.endObj - currentBlock.startObj,
                        currentBlock.start, currentBlock.end,
                        !currentBlock.isPassing, currentBlock.id
                    );
                }
            }
        }

        function renderTable() {
            const tbody = document.getElementById('schedule-body');
            tbody.innerHTML = '';
            if(activeTimeline.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" class="px-6 py-4 text-center text-gray-500">Enjoy your weekend!</td></tr>`;
                return;
            }
            activeTimeline.filter(t => !t.isPassing).forEach(block => {
                const tr = document.createElement('tr');
                tr.id = `row-${block.id}`;
                tr.className = "sched-row transition-colors border-l-4 border-transparent hover:bg-gray-50 dark:hover:bg-gray-700/30";
                const editBtn = block.editable ? `<button onclick="editPeriod('${block.id}')" class="ml-2 text-gray-400 hover:text-brand-500 transition-colors" title="Edit"><svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>` : '';
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 dark:text-white w-1/2">${block.displayName} ${editBtn}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400 text-right w-1/2 font-mono">${block.start} - ${block.end}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- Interaction & Visuals ---
        function updateGlider() {
            const btns = ['auto', 'regular', 'common'];
            btns.forEach(b => {
                const el = document.getElementById(`btn-${b}`);
                if(b === state.scheduleMode) {
                    el.classList.add('text-brand-600', 'dark:text-brand-400');
                    el.classList.remove('text-gray-500', 'dark:text-gray-400');
                    const glider = document.getElementById('glider');
                    glider.style.width = `${el.offsetWidth}px`;
                    glider.style.transform = `translateX(${el.offsetLeft}px)`;
                } else {
                    el.classList.remove('text-brand-600', 'dark:text-brand-400');
                    el.classList.add('text-gray-500', 'dark:text-gray-400');
                }
            });
        }

        function setManualSchedule(mode) {
            state.scheduleMode = mode;
            updateGlider(); saveState(); buildTimeline(); renderTable(); updateClock();
        }

        function applySettingsDOM() {
            document.documentElement.setAttribute('data-color', state.colorScheme);
            document.getElementById('toggle-p0').checked = state.hidePeriod0;
            document.getElementById('select-shape').value = state.progressShape;
            document.getElementById('select-color').value = state.colorScheme;
            document.getElementById('select-bg').value = state.bgMode;
            
            if (state.progressShape === 'circular') {
                document.getElementById('view-horizontal').classList.add('hidden');
                document.getElementById('view-circular').classList.remove('hidden');
            } else {
                document.getElementById('view-circular').classList.add('hidden');
                document.getElementById('view-horizontal').classList.remove('hidden');
            }
        }

        function updateSettings() {
            state.progressShape = document.getElementById('select-shape').value;
            state.colorScheme = document.getElementById('select-color').value;
            state.bgMode = document.getElementById('select-bg').value;
            applySettingsDOM(); saveState(); renderBackground(); updateClock();
        }

        function toggleTheme() {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            applyTheme(); saveState();
        }

        function applyTheme() {
            const html = document.documentElement;
            if (state.theme === 'dark') {
                html.classList.add('dark');
                document.getElementById('theme-icon-dark').classList.add('hidden');
                document.getElementById('theme-icon-light').classList.remove('hidden');
            } else {
                html.classList.remove('dark');
                document.getElementById('theme-icon-light').classList.add('hidden');
                document.getElementById('theme-icon-dark').classList.remove('hidden');
            }
            renderBackground(); // Restart canvas if colors changed
        }

        function toggleSettings() {
            const wrapper = document.getElementById('settings-wrapper');
            const isOpen = wrapper.style.gridTemplateRows === '1fr';
            if (isOpen) {
                wrapper.style.gridTemplateRows = '0fr';
                wrapper.style.opacity = '0';
                setTimeout(() => wrapper.style.visibility = 'hidden', 400);
            } else {
                wrapper.style.visibility = 'visible';
                wrapper.style.gridTemplateRows = '1fr';
                wrapper.style.opacity = '1';
            }
        }

        function togglePeriodZero() {
            state.hidePeriod0 = document.getElementById('toggle-p0').checked;
            saveState(); buildTimeline(); renderTable(); updateClock();
        }

        function editPeriod(id) {
            let defName = '';
            for(let k in rawSchedules) {
                const f = rawSchedules[k].find(p => p.id === id);
                if(f) { defName = f.defaultName; break; }
            }
            const current = state.customNames[id] || defName;
            const newName = prompt(`Enter custom name for ${defName}:`, current);
            if (newName !== null) {
                const t = newName.trim();
                if (t === '' || t === defName) delete state.customNames[id];
                else state.customNames[id] = t;
                saveState(); buildTimeline(); renderTable(); updateClock();
            }
        }

        function updateDateDisplay() {
            const o = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date-display').innerText = new Date().toLocaleDateString(undefined, o);
        }

        // --- Background Animations ---
        function renderBackground() {
            cancelAnimationFrame(bgAnimId);
            const canvas = document.getElementById('bg-canvas');
            const cssBg = document.getElementById('bg-css');
            const ctx = canvas.getContext('2d');
            
            canvas.classList.add('hidden');
            cssBg.className = 'fixed inset-0 z-[-1] pointer-events-none hidden';

            if (state.bgMode === 'none') return;

            if (state.bgMode === 'topology') {
                cssBg.classList.remove('hidden');
                cssBg.classList.add('bg-topology');
                return;
            }

            canvas.classList.remove('hidden');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const isDark = state.theme === 'dark';
            const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--brand-500').trim();

            if (state.bgMode === 'matrix') {
                const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
                const fontSize = 14;
                const columns = canvas.width / fontSize;
                const drops = Array(Math.floor(columns)).fill(1);
                
                function drawMatrix() {
                    ctx.fillStyle = isDark ? 'rgba(17, 24, 39, 0.1)' : 'rgba(249, 250, 251, 0.1)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = primaryColor || '#14b8a6';
                    ctx.font = fontSize + 'px monospace';
                    for(let i = 0; i < drops.length; i++) {
                        const text = chars[Math.floor(Math.random() * chars.length)];
                        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                        if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                        drops[i]++;
                    }
                    bgAnimId = requestAnimationFrame(drawMatrix);
                }
                drawMatrix();
            } else if (state.bgMode === 'stars') {
                const numStars = 150;
                const stars = Array.from({length: numStars}, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    z: Math.random() * 2
                }));
                function drawStars() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = isDark ? '#ffffff' : primaryColor || '#14b8a6';
                    stars.forEach(star => {
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, star.z, 0, Math.PI * 2);
                        ctx.fill();
                        star.y -= star.z * 0.5;
                        if (star.y < 0) { star.y = canvas.height; star.x = Math.random() * canvas.width; }
                    });
                    bgAnimId = requestAnimationFrame(drawStars);
                }
                drawStars();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
